<style>
/* Layout: plasma pixelado e derretido no fundo (canvas em baixa resolução); por cima, adesivos sólidos com sombra dura, numa coluna só */
:root{
  --void:#14081F; --card:#1E0F33; --ink:#FFF4E2; --ink-2:#CDB8E8;
  --tang:#FF6B1A; --pink:#FF3CAC; --acid:#FFD23F; --teal:#00D1B2; --violet:#8A4DFF;
  --f-groovy:"Shrikhand","Cooper Black",Georgia,serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
  --f-body:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;overflow-x:hidden}
::selection{background:var(--pink);color:var(--void)}
a{color:inherit}
:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
#plasma{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0;display:block}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px;display:flex;flex-direction:column;gap:56px}

/* topo */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;background:var(--void);border:2px solid var(--ink);padding:6px 10px;box-shadow:3px 3px 0 var(--pink)}
.lang{display:inline-flex;border:2px solid var(--ink);background:var(--void);box-shadow:3px 3px 0 var(--acid)}
.lang button{font-family:var(--f-pixel);font-size:13px;border:0;background:transparent;color:var(--ink);padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acid);color:var(--void)}

/* hero */
.hero{display:flex;flex-direction:column;gap:18px;padding-top:4vh}
.hello{font-family:var(--f-pixel);font-size:clamp(13px,1.6vw,16px);color:var(--acid);background:var(--void);padding:4px 8px;align-self:flex-start}
h1{margin:0;font-family:var(--f-groovy);font-weight:400;font-size:clamp(64px,15vw,190px);line-height:.86;letter-spacing:-.01em;color:var(--acid);
  text-shadow:4px 4px 0 var(--tang),8px 8px 0 var(--pink),12px 12px 0 var(--violet),16px 16px 0 var(--void);filter:url(#melt);user-select:none}
h1 span{display:block}
h1 span:last-child{color:var(--ink);margin-left:.35em}
.role{font-family:var(--f-pixel);font-size:clamp(18px,3vw,30px);line-height:1.2;background:var(--void);border:3px solid var(--ink);padding:12px 16px;align-self:flex-start;box-shadow:6px 6px 0 var(--teal);max-width:100%}
.role b{color:var(--pink);font-weight:700}
.role .cur{display:inline-block;width:.6em;height:1em;background:var(--acid);vertical-align:-.12em;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro{max-width:60ch;font-size:clamp(17px,2vw,20px);background:var(--card);border:3px solid var(--ink);padding:18px 20px;box-shadow:6px 6px 0 var(--violet)}
.trip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-pixel);font-size:12px;background:var(--void);border:2px solid var(--ink);padding:10px 14px;align-self:flex-start;box-shadow:3px 3px 0 var(--tang)}
.trip input{accent-color:var(--pink);width:180px}

/* seções */
section{display:flex;flex-direction:column;gap:22px}
h2{margin:0;font-family:var(--f-groovy);font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1;color:var(--ink);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--void);text-wrap:balance}
.kicker{font-family:var(--f-pixel);font-size:12px;letter-spacing:.08em;color:var(--void);background:var(--acid);padding:4px 8px;align-self:flex-start}

/* números */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.stat{background:var(--card);border:3px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.stat:nth-child(4n+1){box-shadow:5px 5px 0 var(--tang)}.stat:nth-child(4n+2){box-shadow:5px 5px 0 var(--pink)}.stat:nth-child(4n+3){box-shadow:5px 5px 0 var(--teal)}.stat:nth-child(4n+4){box-shadow:5px 5px 0 var(--acid)}
.stat b{font-family:var(--f-pixel);font-size:clamp(28px,4vw,40px);line-height:1;color:var(--acid);font-variant-numeric:tabular-nums}
.stat span{font-size:15px;color:var(--ink-2)}
.stat:hover{transform:translate(-3px,-3px) rotate(-1deg)}

/* trajetória */
.jobs{display:flex;flex-direction:column;gap:22px}
.job{position:relative;background:var(--card);border:3px solid var(--ink);padding:22px 24px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 28px;transition:transform .2s ease,box-shadow .2s ease}
.job:nth-child(odd){box-shadow:7px 7px 0 var(--pink)}.job:nth-child(even){box-shadow:7px 7px 0 var(--teal)}
.job:hover{transform:translate(-4px,-4px) rotate(-.4deg)}
.job:nth-child(odd):hover{box-shadow:11px 11px 0 var(--pink)}.job:nth-child(even):hover{box-shadow:11px 11px 0 var(--teal)}
.when{font-family:var(--f-pixel);font-size:12.5px;color:var(--acid);line-height:1.5}
.where{font-family:var(--f-pixel);font-size:11px;color:var(--ink-2);margin-top:6px}
.job h3{margin:0;font-family:var(--f-body);font-weight:800;font-size:clamp(22px,3vw,28px);letter-spacing:-.01em;line-height:1.1}
.job h3 small{display:block;font-family:var(--f-pixel);font-weight:400;font-size:13px;color:var(--pink);margin-top:6px;letter-spacing:.02em}
.job p{margin:8px 0 0;max-width:62ch}
.job ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.job li{padding-left:22px;position:relative;font-size:16px;color:var(--ink-2)}
.job li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;background:var(--tang);box-shadow:3px 3px 0 var(--violet)}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stack i{font-style:normal;font-family:var(--f-pixel);font-size:11px;border:2px solid var(--ink-2);padding:2px 7px;color:var(--ink)}
@media (max-width:720px){.job{grid-template-columns:minmax(0,1fr)}}

/* skills */
.skills{display:flex;flex-wrap:wrap;gap:12px}
.skill{font-family:var(--f-pixel);font-size:14px;padding:9px 14px;border:3px solid var(--void);color:var(--void);cursor:grab;user-select:none;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.skill:nth-child(5n+1){background:var(--acid)}.skill:nth-child(5n+2){background:var(--pink)}.skill:nth-child(5n+3){background:var(--teal)}.skill:nth-child(5n+4){background:var(--tang)}.skill:nth-child(5n+5){background:var(--violet);color:var(--ink)}
.skill:hover{transform:rotate(-6deg) scale(1.12)}
.skill:nth-child(even):hover{transform:rotate(6deg) scale(1.12)}

/* estudo e contato */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.box{background:var(--card);border:3px solid var(--ink);padding:20px;box-shadow:6px 6px 0 var(--acid);display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{margin:0;font-family:var(--f-pixel);font-size:16px;color:var(--acid)}
.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.box li{font-size:16px}
.box li b{display:block}
.box li span{color:var(--ink-2);font-size:15px}
.contact{display:flex;flex-wrap:wrap;gap:14px}
.btn{font-family:var(--f-pixel);font-size:14px;text-decoration:none;background:var(--pink);color:var(--void);border:3px solid var(--ink);padding:12px 16px;box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:8px}
.btn:nth-child(2){background:var(--teal)}.btn:nth-child(3){background:var(--acid)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.mail{font-family:var(--f-pixel);font-size:13px;color:var(--ink-2);user-select:all}
footer{font-family:var(--f-pixel);font-size:11px;color:var(--ink);background:var(--void);border:2px solid var(--ink);padding:10px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--acid)}
@media (prefers-reduced-motion:reduce){.role .cur{animation:none}.job,.stat,.skill,.btn{transition:none}}
</style>
</head>

 foot:"© Igor Natanael · feito com pixels e cor demais", brick:"assente um tijolo →"
}};
let L='en';
try{const s=localStorage.getItem('lang');if(s==='pt'||s==='en')L=s;}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const D=T[L];document.documentElement.lang=L==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-i]').forEach(e=>{const v=D[e.dataset.i];if(typeof v==='string')e.textContent=v;});
  document.getElementById('bEn').setAttribute('aria-pressed',L==='en');document.getElementById('bPt').setAttribute('aria-pressed',L==='pt');
  document.getElementById('stats').innerHTML=D.stats.map(([n,t])=>`<div class="stat"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join('');
  document.getElementById('jobs').innerHTML=D.jobs.map(j=>`<article class="job"><div><div class="when">${esc(j.when)}</div><div class="where">${esc(j.where)}</div></div><div><h3>${esc(j.co)}<small>${esc(j.role)}</small></h3><p>${esc(j.p)}</p><ul>${j.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="stack">${j.stack.map(x=>`<i>${esc(x)}</i>`).join('')}</div></div></article>`).join('');
  document.getElementById('skills').innerHTML=D.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join('');
  document.getElementById('edu').innerHTML=D.edu.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('');
  document.getElementById('langs').innerHTML=D.langs.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('');
  roleI=0;typeRole(true);
}
function setLang(l){L=l;try{localStorage.setItem('lang',l);}catch(e){}render();}
document.getElementById('bEn').onclick=()=>setLang('en');
document.getElementById('bPt').onclick=()=>setLang('pt');

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* papel que se digita sozinho */
let roleI=0,roleTimer=null;const roleEl=document.getElementById('roleTxt');
function typeRole(reset){
  clearTimeout(roleTimer);const list=T[L].roles,word=list[roleI%list.length];
  if(reduce){roleEl.textContent=word;roleTimer=setTimeout(()=>{roleI++;typeRole();},2600);return;}
  let k=reset?word.length:0;roleEl.textContent=reset?word:'';
  const step=()=>{if(k<word.length){roleEl.textContent=word.slice(0,++k);roleTimer=setTimeout(step,55);}else roleTimer=setTimeout(back,1900);};
  const back=()=>{if(k>0){roleEl.textContent=word.slice(0,--k);roleTimer=setTimeout(back,28);}else{roleI++;typeRole();}};
  reset?roleTimer=setTimeout(back,1900):step();
}

/* plasma pixelado: poucos pixels, paleta setentista, o mouse entorta */
const cv=document.getElementById('plasma'),cx=cv.getContext('2d');
const PAL=[[20,8,31],[138,77,255],[255,60,172],[255,107,26],[255,210,63],[0,209,178],[138,77,255],[20,8,31]];
let W,H,img,mx=.5,my=.4,trip=.45,t0=performance.now();
function size(){const s=Math.max(innerWidth,innerHeight)>900?7:6;W=Math.ceil(innerWidth/s);H=Math.ceil(innerHeight/s);cv.width=W;cv.height=H;img=cx.createImageData(W,H);}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight;});
const tripR=document.getElementById('tripR');tripR.oninput=()=>{trip=tripR.value/100;};
const turb=document.getElementById('turb'),disp=document.getElementById('disp');
function frame(now){
  const t=(reduce?0:(now-t0))/1000*(0.25+trip*0.9),d=img.data,amp=0.6+trip*2.2;
  for(let y=0;y<H;y++){const v=y/H;for(let x=0;x<W;x++){const u=x/W;
    const dx=u-mx,dy=v-my,r=Math.sqrt(dx*dx+dy*dy);
    const wu=u+Math.sin(v*6+t*1.3)*0.06*amp+Math.sin(r*14-t*2)*0.03*amp,wv=v+Math.cos(u*5-t)*0.08*amp;
    let s=Math.sin(wu*7+t)+Math.sin(wv*9-t*1.1)+Math.sin((wu+wv)*6+t*.7)+Math.sin(r*18-t*2.4)*0.8;
    s=(s+3.8)/7.6;s=(s*1.6+t*0.05)%1;
    const q=Math.floor(s*(PAL.length-1)),c=PAL[q],i=(y*W+x)*4;
    d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}}
  cx.putImageData(img,0,0);
  if(!reduce){turb.setAttribute('baseFrequency',`${0.006+Math.sin(t*.6)*0.002} ${0.025+Math.sin(t*.9)*0.012}`);}
  disp.setAttribute('scale',String(4+trip*34));
  if(!reduce)requestAnimationFrame(frame);
}
render();requestAnimationFrame(frame);
if(reduce){tripR.addEventListener('input',()=>requestAnimationFrame(frame));}
</script>
